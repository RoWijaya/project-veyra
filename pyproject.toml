[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra"
version = "0.1.0"
description = "Multi-tenant business operations platform"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=12.2,<14",
  "Authlib>=1.9.8,<2",
  "pyotp>=2.12,<3",
  "requests>=2.32,<3",
  "Django>=5.2,<6.2",
  "channels>=4.2,<5",
  "channels-redis>=4.2,<5",
  "python-dotenv>=1.0,<2",
  "whitenoise>=6.9,<7",
  "redis>=5.2,<7",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=50.0.2,<51",
  "qrcode>=8.2,<9",
  "gunicorn>=23,<24",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["daphne>=4.1,<5", "pytest>=9.0.3,<10", "pytest-django>=4.10,<5", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["config*", "core*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
