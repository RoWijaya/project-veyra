<details class="tender-details" data-tender-section><summary>Record payment</summary><form method="post" action="{% url 'record_payment' business.slug order.pk %}" class="status-form payment-record-form" data-payment-record>{% csrf_token %}{% if from_history %}<input type="hidden" name="source" value="history">{% endif %}<input type="hidden" name="idempotency_key" value="{{ order.payment_key }}"><label><span>Payment received</span><select name="method" data-tender-method><option value="cash">Cash</option><option value="card">Card (confirm terminal payment)</option></select></label><label data-cash-field><span>Cash received (Rp)</span><input type="number" name="cash_received" min="0" step="0.01" inputmode="decimal"></label><label><span>Card reference (optional)</span><input name="reference" maxlength="120"></label><button class="button button-small">Record payment</button></form></details>
