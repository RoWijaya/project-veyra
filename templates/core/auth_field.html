<div class="field{% if field.field.widget.input_type == 'password' %} password-field{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.field.widget.input_type == 'password' %}
  <div class="password-control" data-password-control>
    {{ field }}
    <button type="button" class="text-button password-toggle" aria-controls="{{ field.auto_id }}"
            data-password-toggle="{{ field.label|lower }}" hidden>Show</button>
  </div>
  {% else %}{{ field }}{% endif %}
  {% if field.help_text %}<div class="field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
